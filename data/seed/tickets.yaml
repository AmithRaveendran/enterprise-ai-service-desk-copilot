- title: Secure Print job not releasing at the 3rd floor printer
  description: Badge tap works but my print jobs never appear at the 3rd floor printer.
  category: hardware
  priority: P3
  status: resolved
  requester: li.wei@halcyon-dynamics.example
  service: printing
  resolution: The printer had lost its connection to the print server. Restarted the print queue; jobs release normally again.


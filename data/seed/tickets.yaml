- title: VPN disconnects every few minutes on MacBook
  description: |-
    Since updating to macOS 15 my SecureLink VPN drops every 5-10 minutes when the laptop
    is on battery. Reconnecting works but it keeps happening.
  category: network
  priority: P3
  status: in_progress
  requester: priya.sharma@halcyon-dynamics.example
  assignee: network.ops@halcyon-dynamics.example
  service: vpn
  comments:
    - author: network.ops@halcyon-dynamics.example
      body: This matches known issue KI-0007. Please try switching SecureLink to TCP and let us know.


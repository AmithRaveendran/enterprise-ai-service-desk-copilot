[project]
name = "servicedesk-copilot"
version = "0.0.1"
description = "Enterprise AI Service Desk Copilot: an agentic RAG support assistant built with FastAPI, LangGraph, PostgreSQL/pgvector and MCP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Amith Raveendran" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "pyyaml>=6.0",
    "fpdf2>=2.8",   # only used by scripts/build_pdfs.py to generate sample PDF docs
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servicedesk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import sorting, B = bugbear, UP = pyupgrade, SIM = simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

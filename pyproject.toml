[project]
name = "servicedesk-copilot"
version = "0.2.0"
description = "Enterprise AI Service Desk Copilot: an agentic RAG support assistant built with FastAPI, LangGraph, PostgreSQL/pgvector and MCP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Amith Raveendran" }]
dependencies = [
    "alembic>=1.14",
    "beautifulsoup4>=4.12",
    "fastapi>=0.162.0",
    "openai>=1.60",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "tenacity>=9.0",
    "tiktoken>=0.8",
    "typer>=0.15",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
servicedesk = "servicedesk.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "fpdf2>=2.8",   # only used by scripts/build_pdfs.py to generate sample PDF docs
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servicedesk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import sorting, B = bugbear, UP = pyupgrade, SIM = simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Path objects are immutable, so they are safe as default argument values (used by the CLI).
extend-immutable-calls = ["pathlib.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs the Docker Postgres database (skipped automatically if it is not running)",
]
